name: Keep Supabase awake

# Free Supabase projects pause after about a week without activity.
# This calls the harmless ping() function twice a week so the project stays active.
# Setup: repo Settings -> Secrets and variables -> Actions -> add
#   SUPABASE_URL       e.g. https://abcd1234.supabase.co
#   SUPABASE_ANON_KEY  the anon/public key
# Then run it once from the Actions tab ("Run workflow") to confirm it works.

on:
  schedule:
    - cron: '17 6 * * 1,4'   # Monday and Thursday, 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call ping()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY secret"; exit 1
          fi
          status=$(curl -sS -o response.txt -w '%{http_code}' \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $status"
          cat response.txt; echo
          [ "$status" = "200" ]
